name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # Not `make build`: that target adhoc-codesigns the binary for macOS Full
      # Disk Access, which has no meaning on this runner and no `codesign` to
      # run. `make test` is `go test -race ./...`, which is what the test step
      # below runs.
      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./... -count=1
