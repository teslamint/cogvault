name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # Not `make build`: that target adhoc-codesigns the binary for macOS Full
      # Disk Access, which has no meaning on this runner and no `codesign` to
      # run. Shell tests and go test run under the test step below.
      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Same script as `make lint`: one pinned gosec for local and CI.
      - name: lint
        run: sh scripts/lint.sh

      - name: test
        run: |
          sh scripts/make_build_test.sh
          sh scripts/make_install_test.sh
          sh scripts/install-signed_test.sh
          go test -race ./... -count=1
